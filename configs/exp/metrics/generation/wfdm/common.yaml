# @package _global_

defaults:
  - /paths/paths
  - /paths/wfdm_synthetic_datasets
  - optional /paths: override # private path overrides, gitignored
  - /dataset/brainscape
  - /dataset/brainscape_stats
  - /metrics/generation
  - /hydra/output
  - /hydra/logging
  - _self_

seed: 42
device: auto
project: wfdm_generation_metrics

report:
  model_name: "WFDM"
  study_name: "WFDM Synthetic Generation Metrics"
  conditioning: "Modality + demographics"
  notes: "Metrics for WFDM scheduler variants"

dataset:
  brainscape:
    # Use the synthetic JSON (contains both real + synthetic paths).
    json_path: ${metrics_job.synthetic_json}

    # Default root for real images; synthetic spec overrides this per input_spec.
    dataset_root: ${metrics_job.real_root}

    test_batch_size: 8
    num_workers: 4
    cache_rate: 0.0
    prefetch_factor: 2
    pin_memory: false
    persistent_workers: true

    modalities: [T1w, T2w, T1ce, FLAIR]

    input_specs:
      - key: image
        group: preprocessed
        modalities: [T1w, T2w, T1ce, FLAIR]
        dataset_root: ${metrics_job.real_root}

      - key: syn_image
        group: synthetic
        modalities: [T1w, T2w, T1ce, FLAIR]
        dataset_root: ${metrics_job.synthetic_root}

    test_tf:
      _target_: brainmint.data.transforms.mri_vae.VAETransform
      is_train: false
      random_aug: false
      brain_roi_size: ${dataset.brain_roi_size}
      affine_type: original
      val_patch_size: null
      output_dtype: float32

      image_keys: [image, syn_image]
      label_keys: []
      passthrough_keys: []
      meta_keys:
        - modality

      extra_xforms_start:
      - _target_: brainmint.data.transforms.copy_paths.CopyKeysToNewKeysd
        src_keys: [image]
        dst_keys: [image_path]
        allow_missing_keys: false
      - _target_: brainmint.data.transforms.copy_paths.CopyKeysToNewKeysd
        src_keys: [syn_image]
        dst_keys: [syn_image_path]
        allow_missing_keys: false

metrics_job:
  # Real dataset lives under BrainScape prep
  real_root: ${paths.brainscape_root}
  # Synthetic dataset generated by experiments/synthetic_dataset/generate_synthetic_dataset.py
  synthetic_root: null
  synthetic_json: null
