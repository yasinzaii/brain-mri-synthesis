# @package callbacks

# Top-3 best + last (monitor the alias val_total)
base_checkpoint_val:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${hydra:runtime.output_dir}/checkpoints/val
  monitor: val_total
  mode: min
  filename: "epoch{epoch:03d}-val{val_total:.5f}"
  auto_insert_metric_name: false
  save_top_k: 3
  save_last: true

# Save a checkpoint EVERY epoch (unconditional)
base_checkpoint_train:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${hydra:runtime.output_dir}/checkpoints/train
  monitor: null
  filename: "epoch{epoch:03d}"
  auto_insert_metric_name: false
  save_top_k: -1          # save ALL epochs
  every_n_epochs: 1
  save_on_train_epoch_end: true

# QoL callbacks
# - _target_: pytorch_lightning.callbacks.LearningRateMonitor
#   logging_interval: epoch

base_model_summary:
  _target_: pytorch_lightning.callbacks.ModelSummary
  max_depth: 4



