# @package callbacks

defaults:
  - base  # inherit all from base.yaml
  - _self_

compression_callbacks:
  - ${callbacks.base_checkpoint_val}
  - ${callbacks.base_checkpoint_train}
  - ${callbacks.base_model_summary}
  - ${callbacks.compression_save_mri_images}


# Callback for saving compression reconstructions
compression_save_mri_images:
  _target_: brainmint.callbacks.log_images.SaveMRIImages
  modalities: ["T1w", "T2w", "T1ce", "FLAIR"]
  tag: "val"
  subdir: "val_samples"
  dirpath: ${hydra:runtime.output_dir}
  infer_kwarg_keys: [image]   # First Key is the input MRI
  infer_method_candidates: ["run_inference"]
  fallback_to_forward: false
  output_names: ["recon", "z_mu", "z_sigma"]
  save_outputs: [1, 0, 0]  # Only save the "Reconstruction" tensor
  input_save_list: [image]
  save_dtype: torch.float32
  clamp_min: 0.0
  clamp_max: 1.0
  separate_folder: false


