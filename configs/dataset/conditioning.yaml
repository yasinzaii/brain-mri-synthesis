# @package dataset.conditioning 

modality_map:
  t1w: 0
  t2w: 1
  t1ce: 2    
  flair: 3

# Transform for Mapping Modality [t1w, t2w, t1ce, flair] to [0, 1, 2, 3]
modality_conditioning:
  _target_: brainmint.data.transforms.conditioning.MapModalityToLabeld
  mapping: ${dataset.conditioning.modality_map}  
  key_name: "modality_map"
  allow_missing_keys: false # Modality Info should be present
  fail_on_unknown: true  # Fail on unknown modality

constant_modality_label: none # ${dataset.conditioning.modality_map.t1w}

constant_modality_conditioning:
  _target_: brainmint.data.transforms.conditioning.ConstantModalityLabeld
  label: ${dataset.conditioning.constant_modality_label}
  key_name: "modality_map"
  overwrite: true



  
