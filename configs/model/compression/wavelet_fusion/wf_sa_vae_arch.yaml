# @package model.compression.wavelet_fusion

defaults:
  - /model/compression/wavelet_fusion/wf_vae_arch
  - _self_

# WF-SA-VAE: WaveletFusion VAE with symmetric non-local self-attention enabled.
autoencoder:
  with_encoder_nonlocal_attn: true
  with_decoder_nonlocal_attn: true
  use_flash_attention: true
